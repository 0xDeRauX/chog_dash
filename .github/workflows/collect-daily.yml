name: Collect daily data

on:
  schedule:
    - cron: "23 6 * * *" # 06:23 UTC daily (off-the-hour to reduce GitHub's schedule delay)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Discover chain radar (Monad + Robinhood + Base)
        id: radar
        continue-on-error: true
        run: npm run collect:radar

      - name: Collect X mentions
        id: mentions
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run collect:mentions

      - name: Collect prices
        id: prices
        continue-on-error: true
        run: npm run collect:prices

      - name: Collect on-chain TON prices (tonapi, full history)
        id: ton_price
        continue-on-error: true
        run: npm run collect:ton-price

      # Free Coin Metrics community API (no key): full life-of-asset price,
      # volume, market cap, holders and the % en gain proxy for BTC/ETH/XRP/ZEC.
      - name: Collect Coin Metrics full history (BTC, ETH…)
        id: cm_history
        continue-on-error: true
        run: npm run collect:cm-history

      - name: Collect chain TVL
        id: tvl
        continue-on-error: true
        run: npm run collect:tvl

      - name: Collect Discord members
        id: discord
        continue-on-error: true
        run: npm run collect:discord

      - name: Collect Telegram members
        id: telegram
        continue-on-error: true
        run: npm run collect:telegram

      # Persist the on-chain holder balance ledger between runs (outside the
      # repo) so holders update incrementally instead of re-indexing daily.
      - name: Restore holder state
        uses: actions/cache@v4
        with:
          path: |
            data/holders-state
            data/pnl-state
          key: chog-ledger-v2-${{ github.run_id }}
          restore-keys: |
            chog-ledger-v2-

      - name: Collect holders
        id: holders
        continue-on-error: true
        env:
          THIRDWEB_SECRET_KEY: ${{ secrets.THIRDWEB_SECRET_KEY }}
          HYPERSYNC_API_KEY: ${{ secrets.HYPERSYNC_API_KEY }}
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
          blockvision_api_key_sui: ${{ secrets.BLOCKVISION_API_KEY_SUI }}
          blockvision_api_key_monad: ${{ secrets.BLOCKVISION_API_KEY_MONAD }}
        run: npm run collect:holders

      - name: Collect trade flow (buy/sell volume)
        id: tradeflow
        continue-on-error: true
        run: npm run collect:tradeflow

      # After prices (cost basis needs the day's price) and holders (shares the
      # cached state directory). Incremental: only new blocks are folded.
      # (Dune PnL steps removed Oct 2026 — accounts suspended; EVM memes now
      # run through this ledger, Solana memes through the holders scan.)
      - name: Holder ledgers — CHOG, PEPE, ONDO, BRETT (HyperRPC)
        id: ledger
        continue-on-error: true
        env:
          THIRDWEB_SECRET_KEY: ${{ secrets.THIRDWEB_SECRET_KEY }}
          HYPERSYNC_API_KEY: ${{ secrets.HYPERSYNC_API_KEY }}
          # a cap, not a duration: the first index of the EVM ledgers (~5h at
          # 5 req/min) spreads over 2-3 runs (state cached), then ~1 min/day.
          # Stays well under the 6h job limit.
          LEDGER_BUDGET_MIN: "150"
        run: npm run collect:pnl

      - name: TON jetton % en gain (toncenter)
        id: ton_pnl
        continue-on-error: true
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: npm run collect:ton-pnl

      - name: Ingest into SQLite
        run: npm run ingest

      - name: Build dashboard data
        run: npm run build:dashboard

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit the raw sources first; data.json is GENERATED and rebuilt below
          # so it's never a merge conflict.
          git add data/raw
          git diff --cached --quiet || git commit -m "Daily raw data $(date -u +%Y-%m-%d)"
          # A long run can finish after other commits landed on main (e.g. a manual
          # push). Merge them in (keeping our fresh raw data on any same-file clash),
          # then rebuild the dashboard from the merged raw → push always fast-forwards.
          git fetch origin main
          git merge -X ours --no-edit origin/main || true
          npm run ingest && npm run build:dashboard
          git add public/data.json
          git diff --cached --quiet || git commit -m "Rebuild dashboard $(date -u +%Y-%m-%d)"
          git push origin main

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Collectors run with continue-on-error so one dead source no longer
      # skips every later step (2026-09-29 / 10-01: a CoinGecko hiccup lost the
      # whole day). This step turns the run RED afterwards when a collector
      # failed or a source stopped producing fresh data — the data that did
      # arrive is already committed and deployed.
      - name: Health check (failed collectors + stale sources)
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node scripts/check-health.js

